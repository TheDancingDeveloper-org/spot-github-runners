name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Queue deployments instead of cancelling one that is publishing; cancel superseded pull request builds.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out
        # actions/checkout v7.0.1, pinned to the commit the tag resolved to on 2026-10-17.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        id: pages
        # actions/configure-pages v6.0.0, pinned to the commit the tag resolved to on 2026-10-17.
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Install MkDocs
        run: |
          python3 -m venv "${RUNNER_TEMP}/docs-venv"
          "${RUNNER_TEMP}/docs-venv/bin/python" -m pip install --disable-pip-version-check --quiet \
            --requirement docs/requirements.txt

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          NO_MKDOCS_2_WARNING: "true"
        run: |
          "${RUNNER_TEMP}/docs-venv/bin/mkdocs" build --strict --site-dir site

      - name: Upload site
        if: github.event_name != 'pull_request'
        # actions/upload-pages-artifact v5.0.0, pinned to the commit the tag resolved to on 2026-10-17.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages v5.0.1, pinned to the commit the tag resolved to on 2026-10-17.
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
